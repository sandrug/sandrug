<svg xmlns="http://www.w3.org/2000/svg" width="600" height="50" viewBox="0 0 600 50">
  <style>
    text {
      font-family: 'Courier New', Consolas, monospace;
      font-size: 28px;
      font-weight: 700;
      fill: #1f2328;
    }
