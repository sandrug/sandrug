  <text x="0" y="34" clip-path="url(#reveal)">About Me</text>

  <rect class="cursor" x="0" y="8" width="3" height="30">
    <animate attributeName="x" calcMode="discrete" dur="5.5s" repeatCount="indefinite"
      keyTimes="0;0.0364;0.0727;0.1091;0.1455;0.1818;0.2182;0.2545;0.2909;0.5636;0.6;0.6364;0.6727;0.7091;0.7455;0.7818;0.8182"
